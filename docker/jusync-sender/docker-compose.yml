# JUSYNC streaming-sender rig (see README.md in this directory).
#
#   docker compose up --build            (GPU passthrough if the toolkit is set up)
#
# Ports: 5556 = JUSYNC ZMQ broker (UE middleware connects here),
#        6080 = noVNC web desktop, 5901 = raw VNC, 5555 = inter-rank (unused solo).
services:
  sender:
    build:
      context: ../..
      dockerfile: docker/jusync-sender/Dockerfile
    image: jusync-sender:dev
    container_name: jusync-sender
    ports:
      - "5556:5556"
      - "6080:6080"
      - "5901:5901"
    volumes:
      - sender-work:/work
    environment:
      # JUSYNC_SENDER_BIN: anariTutorial_usd_time
      JUSYNC_LOOP: "1"          # keep emitting clip updates like a running sim
      JUSYNC_VNC_PASSWORD: jusync
    shm_size: "1g"
    stdin_open: true            # docker attach / exec friendliness
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video, graphics]

volumes:
  sender-work:
